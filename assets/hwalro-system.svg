<svg xmlns="http://www.w3.org/2000/svg" width="560" height="350" viewBox="0 0 560 350" fill="none">
  <title>Hwalro service and simulation engine</title>
  <desc>A Java service executes the independent Python JuPedSim process, which returns JSON results.</desc>
  <defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#638373" opacity=".28"/></pattern></defs>
  <rect width="560" height="350" fill="url(#grid)"/>
  <g stroke="#82a18f" stroke-width="1.2"><rect x="35" y="75" width="190" height="190" rx="3"/><rect x="335" y="75" width="190" height="190" rx="3"/><path d="M35 115h190M335 115h190"/><path d="M225 154h110m-7-5 7 5-7 5M335 210H225m7-5-7 5 7 5"/></g>
  <g font-family="Arial, sans-serif" fill="#dfebdf"><text x="54" y="100" font-size="11" letter-spacing="2">APPLICATION</text><text x="354" y="100" font-size="11" letter-spacing="2">SIMULATION</text><text x="54" y="155" font-size="26" font-weight="600">Hwalro</text><text x="354" y="155" font-size="26" font-weight="600">JuPedSim</text></g>
  <g font-family="monospace" fill="#b4cbbd" font-size="11"><text x="54" y="184">Java / Spring Boot</text><text x="54" y="205">MyBatis / MySQL</text><text x="354" y="184">Python process</text><text x="354" y="205">Custom C++ engine</text><text x="54" y="247">service repository</text><text x="354" y="247">engine repository</text><text x="255" y="142" font-size="10">execute</text><text x="244" y="234" font-size="10">JSON result</text></g>
  <path d="M35 307h490" stroke="#638373" stroke-dasharray="3 5"/><g fill="#a8c1b1" font-family="monospace" font-size="10"><text x="35" y="331">01 — SERVICE</text><text x="335" y="331">02 — ENGINE &amp; BINDINGS</text></g>
</svg>
